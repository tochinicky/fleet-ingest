# Prometheus for the fleet-ingest lab: scrapes every service's /metrics inside the Compose network, evaluates the
# recording and alert rules, and sends alerts to Alertmanager.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ["ingest-1:9464", "ingest-2:9464"]
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
  - job_name: broker
    static_configs:
      - targets: ["broker-exporter:9464"]
  - job_name: cadvisor
    # cAdvisor's page is about 1 MB and takes a few seconds on Docker Desktop.
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only the containers of this stack, and only the memory and CPU series the dashboard uses.
      - source_labels: [__name__]
        regex: "container_(memory_working_set_bytes|memory_rss|cpu_usage_seconds_total)"
        action: keep
