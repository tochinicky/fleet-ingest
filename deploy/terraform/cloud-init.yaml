#cloud-config
# Prepares the VM for scripts/deploy.sh: Docker and Compose from Ubuntu's archive, the `fleet` admin user (created by
# Azure with the operator's key) in the docker group, password login off, and unattended security updates.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - rsync
  - unattended-upgrades

ssh_pwauth: false

runcmd:
  - usermod -aG docker fleet
  - systemctl enable --now docker
  - mkdir -p /opt/fleet-ingest && chown fleet:fleet /opt/fleet-ingest
