# Broker for the fleet-ingest lab (eclipse-mosquitto:2.1.2-alpine, pinned by D2).

# D6: one listener, mutual TLS only. Every client presents a certificate from the lab CA; its CN becomes the MQTT
# username (gateway ID for gateways, service name for ingest-1, ingest-2, api and ops). The ACL file then limits
# what each username may publish and subscribe to. A certificate on the CRL is refused at the TLS handshake.
# There is no plain listener: even operators read $SYS through 8883, with the `ops` certificate.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
crlfile /mosquitto/certs/crl.pem
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# D3: the broker queue is the bounded buffer.
# Persistence is the persist-sqlite plugin (decisions.md S6-15): queued and in-flight messages, sessions and their
# shared subscriptions go to /mosquitto/data/mosquitto.sqlite3, committed every 5 s. A SIGKILL loses at most the
# last flush period of queue, and a clean restart keeps the shared group (snapshots don't, S3-9). It replaces
# `persistence true`: the two can't be combined. Known 2.1.2 bugs and their canaries: S6-14.
persistence_location /mosquitto/data/
global_plugin /usr/lib/mosquitto_persist_sqlite.so
plugin_opt_flush_period 5

# Fallback: snapshots (D3 as first built). To go back, delete the three lines above except persistence_location,
# uncomment these two, and start from an empty broker queue: neither back end reads the other's files (S6-14).
# A crash then loses up to 60 s of queue, a full 240k snapshot stalls the broker about 3.2 s, and a restart loses
# the shared subscriptions (S0-6, S3-9).
# persistence true
# autosave_interval 60
# Per session: about 10 min of one ingest replica's ~200 msg/s share. A stalled-but-connected session holds about
# this plus 2 x its Receive Maximum before dropping (S0-3).
max_queued_messages 120000
# Payload bytes only (S0-6): p95 payload 163 B (real gateway) x 120,000 x 1.25.
max_queued_bytes 24450000

# $SYS every 10 s: the drop counter, the stored-message gauges and the heap gauges (S0-3, S0-4).
sys_interval 10

log_dest stdout
# Also to a file on a shared volume, which the broker exporter follows for drop and expiry lines (S6-3).
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
