# The "production" profile (D8): the same stack, as it runs on the VM and as `plan`-only slice 7 runs it locally.
#   docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml up -d --build
# What changes from the lab stack:
# - Caddy serves the API and Grafana over HTTPS; nothing else is reachable from outside the host.
# - The broker's 8883 binds to PUBLIC_BIND (0.0.0.0 on the VM) so real gateways can connect; everything else stays
#   on loopback.
# - fleet-sim doesn't start (it's in the `sim` profile): real gateways send the data. cAdvisor stays, because its
#   cross-check of the broker's memory matters more in production, not less.
# - Secrets have no defaults: API_TOKEN and GRAFANA_ADMIN_PASSWORD must be set, and Grafana has no anonymous viewer.
# - Readings are kept 30 days, not the lab's 7 (S8-2): a product decision. Every service that reads RETENTION_DAYS
#   gets the same value, because ingest's too_old cutoff and the partition window must agree.
# - Sized for one small always-on VM (S8-6): toxiproxy, the lab's chaos proxy, doesn't run, so ingest reaches
#   Postgres directly; Prometheus keeps 7 days instead of 8. Both ingest replicas stay: failover is the design.
# - One public name (the VM's DNS label, PUBLIC_HOST): the API at its root, Grafana under /grafana/ (S8-6).
services:
  toxiproxy:
    profiles: [lab]
  migrate:
    environment: { RETENTION_DAYS: "${RETENTION_DAYS:-30}" }
  partitions:
    environment: { RETENTION_DAYS: "${RETENTION_DAYS:-30}" }
  ingest-1:
    environment:
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      DATABASE_URL: postgres://fleet:fleet-dev-only@postgres:5432/fleet
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }
  ingest-2:
    environment:
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      DATABASE_URL: postgres://fleet:fleet-dev-only@postgres:5432/fleet
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }
  prometheus:
    command: !override ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      # Caddy's `email` line, only when ACME_EMAIL is set: certificate authorities reject a placeholder address
      # (example.invalid got `invalidContact` from both Let's Encrypt and ZeroSSL, S8-8). deploy.sh requires it.
      CADDY_ACME_EMAIL: ${ACME_EMAIL:+email ${ACME_EMAIL}}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:80:80"
      - "${PUBLIC_BIND:-127.0.0.1}:443:443"
    depends_on: [api, grafana]
    restart: always

  mosquitto:
    ports: !override
      - "${PUBLIC_BIND:-127.0.0.1}:8883:8883"

  api:
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN (at least 16 characters)}

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  # Only with --profile sim (e.g. a few simulated gateways for the sizing run, S8-6), straight to the broker.
  fleet-sim:
    profiles: [sim]
    environment:
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_URL_CUTTABLE: mqtts://mosquitto:8883
    depends_on: !override
      ingest-1: { condition: service_healthy }
      ingest-2: { condition: service_healthy }

volumes:
  caddy-data: {}
